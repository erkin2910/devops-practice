name: My First CI/CD

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Say Hello
      run: echo "Hello from CI/CD!"
    
    - name: Show files
      run: ls -la
    
    - name: Done
      run: echo "Pipeline finished!"
